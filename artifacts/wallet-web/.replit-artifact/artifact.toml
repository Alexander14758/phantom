kind = "web"
previewPath = "/wallet-web/"
title = "Phantom Wallet Web"
version = "1.0.0"
id = "artifacts/wallet-web"
router = "path"

[[services]]
name = "web"
paths = [ "/wallet-web/" ]
localPort = 20830

[services.development]
run = "pnpm --filter @workspace/wallet-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wallet-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/wallet-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20830"
BASE_PATH = "/wallet-web/"
