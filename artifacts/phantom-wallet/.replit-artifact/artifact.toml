kind = "mobile"
previewPath = "/"
title = "Phantom Wallet"
version = "1.0.0"
id = "artifacts/phantom-wallet"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20811

[services.development]
run = "pnpm --filter @workspace/phantom-wallet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/phantom-wallet", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/phantom-wallet", "run", "serve" ]

[services.env]
PORT = "20811"
BASE_PATH = "/"
