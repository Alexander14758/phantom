<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Phantom</title>
    <meta name="description" content="Phantom Wallet — manage your crypto portfolio" />
    <meta name="robots" content="index, follow" />

    <!-- PWA / iOS Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Phantom" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1A1B23" />
    <link rel="manifest" href="/wallet-web/manifest.json" />
    <!-- Apple Home Screen icon (180×180 is the required size for modern iPhones) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/wallet-web/apple-touch-icon.png" />
    <!-- Browser tab favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/wallet-web/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/wallet-web/favicon-16.png" />

    <!-- OG / Twitter -->
    <meta property="og:title" content="Phantom Wallet" />
    <meta property="og:description" content="Phantom Wallet — manage your crypto portfolio" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/wallet-web/sw.js');
        });
      }
    </script>
  </body>
</html>
